version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Persistent cache — survives container restarts, fully disposable
      - ./data/cache:/app/cache
      # Token + repo config — written by app, never committed
      - ./data/.env:/app/.env
    environment:
      - ENV_FILE=/app/.env
      - CACHE_DIR=/app/cache
      - FRONTEND_URL=http://localhost:3000
      - BACKEND_URL=http://localhost:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
